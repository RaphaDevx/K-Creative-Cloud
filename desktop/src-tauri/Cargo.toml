[package]
name = "k-creative-studio"
version = "0.1.0"
description = "K-Creative Studio Desktop"
authors = ["K-Creative"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.70"

[build-dependencies]
tauri-build = { version = "1", features = [] }

[dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tauri = { version = "1", features = [ "fs-all", "shell-open"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
