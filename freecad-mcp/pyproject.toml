[project]
name = "freecad-mcp"
version = "0.1.0"
description = "FreeCAD MCP bridge — socket connection to FreeCAD addon"
requires-python = ">=3.10"
dependencies = ["mcp[cli]>=1.3.0"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project.scripts]
freecad-mcp = "freecad_bridge:main"

[tool.setuptools]
package-dir = {"" = "src"}
